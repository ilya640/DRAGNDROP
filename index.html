<!DOCTYPE html>
<html>

<head>
    <meta charset=UTF-8>
    <title>drag&amp;drop</title>
</head>

<body style='min-height: 100vh'>
    <img src='http://fe.it-academy.by/Sites/0000007/sax.jpg'>
    <img src='http://fe.it-academy.by/Sites/0000007/Yin_and_Yang.png' width=100 style='vertical-align: 20px'>
    <img src='http://fe.it-academy.by/Sites/0000007/Man-and-woman.png' width=150>
    <img src='http://fe.it-academy.by/Sites/0000007/No_smoking.png' style='padding-left: 50px'>

    <script>
        (function() {
            let draggingImg = null;
            let dragStartLeft = 0,
                dragStartTop = 0;
            let dragStartPageX = 0,
                dragStartPageY = 0;
            let dragOffsetX = 0,
                dragOffsetY = 0;
            let onMouseMove = null;
            let onMouseUp = null;

            function createPlaceholder(img, rect, computedStyle) {
                const placeholder = document.createElement('div');
                placeholder.style.width = rect.width + 'px';
                placeholder.style.height = rect.height + 'px';
                placeholder.style.display = 'inline-block';
                placeholder.style.margin = computedStyle.margin;
                placeholder.style.padding = computedStyle.padding;
                placeholder.style.border = computedStyle.border;
                placeholder.style.verticalAlign = computedStyle.verticalAlign;
                placeholder.style.background = 'transparent';
                placeholder.style.pointerEvents = 'none';
                placeholder.classList.add('drag-placeholder');
                return placeholder;
            }

            function makeDraggable(img) {
                img.addEventListener('mousedown', onMouseDown);
            }

            function onMouseDown(e) {
                if (e.button !== 0) return;
                if (draggingImg) return;

                e.preventDefault();
                const img = e.currentTarget;
                const rect = img.getBoundingClientRect();
                const computedStyle = window.getComputedStyle(img);

                const isAlreadyAbsolute = window.getComputedStyle(img).position === 'absolute';

                if (!isAlreadyAbsolute && !img._placeholder) {
                    const placeholder = createPlaceholder(img, rect, computedStyle);
                    const parent = img.parentNode;
                    if (parent) {
                        parent.insertBefore(placeholder, img);
                        img._placeholder = placeholder;
                    }
                    img.style.position = 'absolute';
                    img.style.left = (rect.left + window.scrollX) + 'px';
                    img.style.top = (rect.top + window.scrollY) + 'px';
                    img.style.width = rect.width + 'px';
                    img.style.height = rect.height + 'px';
                    img.style.margin = '0';
                    img.style.padding = '0';
                    img.style.border = computedStyle.border;
                    document.body.appendChild(img);
                } else if (isAlreadyAbsolute) {
                    if (!img._placeholder) {
                        console.warn('placeholder missing for absolute image');
                    }
                }

                const finalRect = img.getBoundingClientRect();
                dragOffsetX = e.clientX - finalRect.left;
                dragOffsetY = e.clientY - finalRect.top;

                dragStartLeft = parseFloat(img.style.left);
                dragStartTop = parseFloat(img.style.top);
                if (isNaN(dragStartLeft)) dragStartLeft = finalRect.left + window.scrollX;
                if (isNaN(dragStartTop)) dragStartTop = finalRect.top + window.scrollY;

                dragStartPageX = e.pageX;
                dragStartPageY = e.pageY;

                draggingImg = img;
                img.style.zIndex = '10000';
                document.body.style.cursor = 'grabbing';

                onMouseMove = function(e) {
                    if (!draggingImg) return;
                    e.preventDefault();
                    const dx = e.pageX - dragStartPageX;
                    const dy = e.pageY - dragStartPageY;
                    let newLeft = dragStartLeft + dx;
                    let newTop = dragStartTop + dy;
                    draggingImg.style.left = newLeft + 'px';
                    draggingImg.style.top = newTop + 'px';
                };

                onMouseUp = function(e) {
                    if (!draggingImg) return;
                    e.preventDefault();
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                    draggingImg.style.zIndex = '';
                    document.body.style.cursor = '';
                    draggingImg = null;
                    onMouseMove = null;
                    onMouseUp = null;
                };

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            }

            const images = document.querySelectorAll('img');
            images.forEach(img => makeDraggable(img));
        })();
    </script>

</body>

</html>
