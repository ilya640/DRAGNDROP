<!DOCTYPE html>
<html>

<head>
    <meta charset=UTF-8>
    <title>drag&amp;drop</title>
</head>

<body style='min-height: 100vh'>
    <img src='http://fe.it-academy.by/Sites/0000007/sax.jpg'>
    <img src='http://fe.it-academy.by/Sites/0000007/Yin_and_Yang.png' width=100 style='vertical-align: 20px'>
    <img src='http://fe.it-academy.by/Sites/0000007/Man-and-woman.png' width=150>
    <img src='http://fe.it-academy.by/Sites/0000007/No_smoking.png' style='padding-left: 50px'>

    <script>
        (function() {
            let dragImg = null,
                offsetX, offsetY;

            for (let img of document.querySelectorAll('img')) {
                img.onmousedown = (e) => {
                    if (e.button !== 0 || dragImg) return;
                    e.preventDefault();

                    const rect = img.getBoundingClientRect();
                    const cs = getComputedStyle(img);

                    const paddingLeft = parseFloat(cs.paddingLeft) || 0;
                    const paddingRight = parseFloat(cs.paddingRight) || 0;
                    const paddingTop = parseFloat(cs.paddingTop) || 0;
                    const paddingBottom = parseFloat(cs.paddingBottom) || 0;
                    const borderLeft = parseFloat(cs.borderLeftWidth) || 0;
                    const borderRight = parseFloat(cs.borderRightWidth) || 0;
                    const borderTop = parseFloat(cs.borderTopWidth) || 0;
                    const borderBottom = parseFloat(cs.borderBottomWidth) || 0;

                    const contentWidth = rect.width - paddingLeft - paddingRight - borderLeft - borderRight;
                    const contentHeight = rect.height - paddingTop - paddingBottom - borderTop - borderBottom;
                    const contentLeft = rect.left + paddingLeft + borderLeft;
                    const contentTop = rect.top + paddingTop + borderTop;

                    if (!img.placeholder) {
                        let ph = document.createElement('div');
                        ph.style.cssText = `width:${rect.width}px; height:${rect.height}px; display:inline-block; margin:${cs.margin}; padding:${cs.padding}; border:${cs.border}; vertical-align:${cs.verticalAlign}; background:transparent; pointer-events:none`;
                        img.parentNode.insertBefore(ph, img);
                        img.placeholder = ph;

                        img.style.position = 'absolute';
                        img.style.left = (contentLeft + window.scrollX) + 'px';
                        img.style.top = (contentTop + window.scrollY) + 'px';
                        img.style.width = contentWidth + 'px';
                        img.style.height = contentHeight + 'px';
                        img.style.margin = '0';
                        img.style.padding = '0';
                        img.style.border = 'none';
                        document.body.appendChild(img);
                    } else {
                        img.style.left = (contentLeft + window.scrollX) + 'px';
                        img.style.top = (contentTop + window.scrollY) + 'px';
                        img.style.width = contentWidth + 'px';
                        img.style.height = contentHeight + 'px';
                        document.body.appendChild(img);
                    }

                    offsetX = e.clientX - (contentLeft + window.scrollX);
                    offsetY = e.clientY - (contentTop + window.scrollY);

                    dragImg = img;
                    img.style.zIndex = '9999';
                    document.body.style.cursor = 'grabbing';

                    const move = (e) => {
                        if (!dragImg) return;
                        e.preventDefault();
                        dragImg.style.left = (e.pageX - offsetX) + 'px';
                        dragImg.style.top = (e.pageY - offsetY) + 'px';
                    };

                    const up = (e) => {
                        if (!dragImg) return;
                        e.preventDefault();
                        dragImg.style.zIndex = '';
                        document.body.style.cursor = '';
                        window.removeEventListener('mousemove', move);
                        window.removeEventListener('mouseup', up);
                        dragImg = null;
                    };

                    window.addEventListener('mousemove', move);
                    window.addEventListener('mouseup', up);
                };
            }
        })();
    </script>
</body>

</html>
