<!DOCTYPE html>
<html>

<head>
    <meta charset=UTF-8>
    <title>drag&amp;drop</title>
</head>

<body style='min-height: 100vh'>
    <img src='http://fe.it-academy.by/Sites/0000007/sax.jpg'>
    <img src='http://fe.it-academy.by/Sites/0000007/Yin_and_Yang.png' width=100 style='vertical-align: 20px'>
    <img src='http://fe.it-academy.by/Sites/0000007/Man-and-woman.png' width=150>
    <img src='http://fe.it-academy.by/Sites/0000007/No_smoking.png' style='padding-left: 50px'>

    <script>
        (function() {
            let dragImg = null,
                offsetX, offsetY;

            for (let img of document.querySelectorAll('img')) {
                img.onmousedown = (e) => {
                    if (e.button !== 0 || dragImg) return;
                    e.preventDefault();
                    const rect = img.getBoundingClientRect();
                    const cs = getComputedStyle(img);

                    if (!img.placeholder) {
                        let ph = document.createElement('div');
                        ph.style.cssText = `width:${rect.width}px; height:${rect.height}px; display:inline-block; margin:${cs.margin}; padding:${cs.padding}; border:${cs.border}; vertical-align:${cs.verticalAlign}; background:transparent; pointer-events:none`;
                        img.parentNode.insertBefore(ph, img);
                        img.placeholder = ph;

                        img.style.position = 'absolute';
                        img.style.left = (rect.left + window.scrollX) + 'px';
                        img.style.top = (rect.top + window.scrollY) + 'px';
                        img.style.width = rect.width + 'px';
                        img.style.height = rect.height + 'px';
                        img.style.margin = '0';
                        img.style.padding = '0';
                        img.style.border = cs.border;
                        document.body.appendChild(img);
                    }

                    const curRect = img.getBoundingClientRect();
                    offsetX = e.clientX - curRect.left;
                    offsetY = e.clientY - curRect.top;

                    dragImg = img;
                    img.style.zIndex = '9999';
                    document.body.style.cursor = 'grabbing';

                    const move = (e) => {
                        if (!dragImg) return;
                        e.preventDefault();
                        dragImg.style.left = (e.pageX - offsetX) + 'px';
                        dragImg.style.top = (e.pageY - offsetY) + 'px';
                    };
                    const up = (e) => {
                        if (!dragImg) return;
                        e.preventDefault();
                        dragImg.style.zIndex = '';
                        document.body.style.cursor = '';
                        window.removeEventListener('mousemove', move);
                        window.removeEventListener('mouseup', up);
                        dragImg = null;
                    };
                    window.addEventListener('mousemove', move);
                    window.addEventListener('mouseup', up);
                };
            }
        })();
    </script>
</body>

</html>
